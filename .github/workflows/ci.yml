# Pull requests: type-check and build, publish nothing.
name: CI

on:
  pull_request:
    # `edited` re-runs the PR title check after a rename.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for linting the PR's commits
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Commit messages: every commit in the PR, and the PR title (it becomes
      # the commit message on a squash merge). Rules: commitlint.config.js.
      - name: Lint commit messages
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Lint PR title
        run: printf '%s' "$TITLE" | npx commitlint --verbose
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - run: node scripts/check-scratch-content.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
